name: 功能建议
description: 希望启动器支持新的能力，或改进现有交互
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看看 README 的[功能列表](https://github.com/MoonCC233/MCLauncher-TUI#功能)与按键说明，再搜索现有 issue 和 PR。有些能力是有意不做的，例如自动写 `%APPDATA%` 或托管正版令牌。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述具体场景，而不是直接给结论
      placeholder: 我在玩 1.19.4 的 Fabric 实例装模组时，需要……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
      description: 涉及按键或界面层级的话，可以写出大致流程
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 界面与交互
        - 版本安装
        - 模组加载器
        - 资源包 / 光影 / 模组
        - Java 与启动
        - 账户
        - 启动器更新与公告
        - 其他

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 现在的绕过办法、考虑过的替代设计等，可以留空

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 参考链接、截图、相关 issue 等，可以留空
