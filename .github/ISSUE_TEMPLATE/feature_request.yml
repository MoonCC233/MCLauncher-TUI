name: 功能建议
description: 希望启动器支持新的能力，或改进现有交互
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 提之前可以先看 README 的功能列表与「已知限制」，有些能力是有意不做的。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述具体场景，而不是直接给结论
      placeholder: 我在给 1.19.4 的 Fabric 实例装模组时，需要……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
      description: 涉及按键或界面层级的话，可以写出大致流程
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 现在的绕过办法、参考链接、截图等，可以留空
