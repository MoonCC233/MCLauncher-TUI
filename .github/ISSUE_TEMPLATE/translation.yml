name: 翻译与文案
description: 某种界面语言下的翻译不准确、缺失或排版错位
title: "[i18n] "
body:
  - type: markdown
    attributes:
      value: |
        界面文案都可以用 `--lang` 和 `--preview` 直接复现，不需要启动游戏：

        ```bash
        mclauncher --lang ja --preview --preview-screen settings
        ```

        终端字体导致的 CJK 宽度、阿拉伯语连写问题不一定是启动器的问题，提交时请附上终端与字体。

  - type: dropdown
    id: language
    attributes:
      label: 界面语言
      options:
        - English (en)
        - Español (es)
        - Français (fr)
        - Deutsch (de)
        - 简体中文 (zh-Hans)
        - 繁體中文 (zh-Hant)
        - 日本語 (ja)
        - العربية (ar)
        - Português (Brasil) (pt-BR)
        - Português (Portugal) (pt-PT)
        - Русский (ru)
        - 한국어 (ko)
        - Türkçe (tr)
        - Tiếng Việt (vi)
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 出现位置
      description: 页面、弹窗或按键提示，最好给出原文
      placeholder: Settings → 「Keep game running」下方的说明文字
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 当前的显示
      description: 直接粘贴看到的文案，排版问题可以附图
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 建议的翻译
      description: 如果有更准确的写法或术语，请写在这里
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现命令
      description: 使用的 `--lang`、`--preview-screen` 或操作路径
      placeholder: mclauncher --lang ja --preview --preview-screen instances
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 已用最新版本的 `--preview` 或实际操作复现过
          required: true
        - label: 已附上终端与字体信息（如果是排版或宽度问题）
